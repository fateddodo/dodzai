version: "3.9"

services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=sqlite:////data/dodzai.db
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      - VITE_API_URL=http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_data:
